[build]
  command = "npm run build"
  publish = ".next"
  # Skip the build when a commit only changes CMS content — pages are
  # force-dynamic and read from Tina at request time, so content edits
  # go live without a rebuild.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- content/"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_TINA_CLIENT_ID = "8806b500-960f-4f66-b582-b1fe3d6c3111"
  NEXT_PUBLIC_TINA_BRANCH = "main"

[[plugins]]
  package = "@netlify/plugin-nextjs"
