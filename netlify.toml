[build]
  command = "npm run build"
  publish = ".next"
  # Skip the build when a commit only changes CMS content — pages are
  # force-dynamic and read from Tina at request time, so content edits
  # go live without a rebuild.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- content/"

[build.environment]
  NODE_VERSION = "20"
  # TINA_TOKEN is a read-only Tina Cloud token intentionally embedded in the
  # Tina admin SPA at build time; don't fail the deploy on its detection.
  SECRETS_SCAN_OMIT_KEYS = "TINA_TOKEN"

[[plugins]]
  package = "@netlify/plugin-nextjs"
