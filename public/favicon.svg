<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4B8A"/>
      <stop offset="100%" stop-color="#0E2646"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C787"/>
      <stop offset="100%" stop-color="#B59154"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Deep Navy Medallion -->
  <circle cx="64" cy="64" r="60" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" stroke-dasharray="2 3"/>

  <!-- Holy Spirit Dove with Olive Branch -->
  <g transform="translate(18, 20) scale(0.72)" filter="url(#shadow)">
    <!-- Wings & Flying Dove Silhouette -->
    <path d="M 64 22 C 58 10, 44 6, 34 10 C 26 13, 22 20, 26 27 C 30 34, 40 38, 50 40 C 38 44, 24 52, 16 64 C 12 70, 14 78, 22 80 C 30 82, 42 78, 54 70 C 46 82, 42 94, 46 100 C 49 104, 56 104, 64 98 C 74 90, 82 78, 86 68 C 92 60, 96 50, 94 40 C 102 36, 112 34, 118 30 C 122 27, 122 22, 116 20 C 108 18, 96 20, 88 26 C 82 18, 72 14, 64 22 Z" fill="#FFFFFF"/>
    <!-- Wing Texture Lines -->
    <path d="M 50 40 C 60 46, 72 50, 82 50" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 44 52 C 54 58, 66 62, 76 62" stroke="#CBD5E1" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Olive Branch in Beak -->
    <path d="M 94 40 Q 106 36 114 42" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="103" cy="36" rx="4.5" ry="2.2" fill="url(#goldGrad)" transform="rotate(-20 103 36)"/>
    <ellipse cx="110" cy="38" rx="4" ry="2" fill="url(#goldGrad)" transform="rotate(30 110 38)"/>
    <ellipse cx="114" cy="44" rx="3.5" ry="1.8" fill="url(#goldGrad)" transform="rotate(-10 114 44)"/>
  </g>
</svg>
